[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-regime-trend-bot"
version = "0.1.0"
description = "Volatility regime + trend filter backtesting bot"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ginsupig" }]

[project.scripts]
vol-regime-backtest = "vol_regime_trend_bot.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

